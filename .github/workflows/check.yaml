name: code-checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:

  code-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip3 install ruff ty
      - name: Run ruff
        run: ruff check --output-format=github .
        continue-on-error: true
      - name: Run ty
        run: ty check --output-format=github .
        continue-on-error: true

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
        confluent-kafka-python-version: [ "2.12.0", "2.13.0", "2.14.0" ]
        fastavro-version: [ "1.10.0", "1.11.0", "1.12.1" ]
        pydantic-version: [ "2.11.0", "2.12.0", "2.13.3" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install requirements
        run: pip3 install pytest
      - name: install dependencies
        run: pip3 install confluent-kafka[avro]==${{ matrix.confluent-kafka-python-version }} fastavro==${{ matrix.fastavro-version }} pydantic==${{ matrix.pydantic-version }}
      - name: Run unit-tests
        run: make unittest
