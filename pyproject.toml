[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafkian2"
version = "0.1.0"
description = "Opinionated Kafka client for Python, with a focus on Avro serialization and Pydantic models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Sergei Beilin", email = "saabeilin@gmail.com" },
]
keywords = ["kafka", "avro", "pydantic", "schema-registry", "confluent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "confluent-kafka[avro]>=2.14.0",
    "pydantic>=2.13.3",
    "typer>=0.15",
]

[project.scripts]
avsc2pydantic = "kafkian2.cli:app"

[project.urls]
Repository = "https://github.com/saabeilin/kafkian2"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --ff"
testpaths = [
    "tests",
]

[tool.ruff]
src = ["."]

line-length = 88
lint.select = [
    #    "ALL"

    "F",    # Pyflakes

    "E",    # pycodestyle
    "W",    # pycodestyle

    "C90",  # mccabe

    "I",    # isort

    "N",    # pep8-naming
#    "D",    # pydocstyle/flake8-docstrings

    "C",    # complexity
    "Q",    # flake8-quotes
    "A",    # flake8-builtins

    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    ##    "PD",   # pandas-vet
    ##        "PL",   # pylint
    #    #    "ANN", # annotations
]
lint.ignore = [
    "ANN", # annotations
    "ANN101", # missing-type-self
    "A002", #  Argument `id` is shadowing a Python builtin - TODO: Fix this
    "N818", # Exception name should be named with an Error suffix - TODO: discuss

    "S101", # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code. TODO: exclude for tests

    "FIX002", # Line contains TODO - this is a warning, not an error :)
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link for TODO

    "PLR2004", # Magic value used in comparison - TODO: exclude for tests?
    "ERA001", # Found commented-out code - this is a warning, not an error :)
    "D100", # Missing docstring in public module - TODO: exclude?
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method - TODO: exclude?
    "D103", # Missing docstring in public function - TODO: exclude?
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in `__init__`
]
lint.fixable = ["ALL"]
lint.unfixable = []
exclude = [
    ".git",
    ".idea",
    ".mypy_cache",
    ".tox",
    ".venv"
]
target-version = "py312"

[tool.ruff.lint.mccabe]
# Flake8 is 15 - which I feel is too high
max-complexity = 8
